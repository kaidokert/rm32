name: "VimDrones L4"
mcu: stm32l431
dead_time: 60
voltage_divider_x100: 2100  # AM32 VOLTAGE_DIVIDER 210 (ratio x10)
millivolt_per_amp: 8
current_offset: 498
current_adc_channel: 8
voltage_adc_channel: 11
bemf_pins:
  phase_a: PB7   # COMP2 INM IO2
  phase_b: PA5   # COMP2 INM IO5
  phase_c: PA4   # COMP2 INM IO4
  common: PB4    # COMP2 INP IO1
