name: "SEQURE G431"
mcu: stm32g431
dead_time: 80
current_adc_channel: 5
voltage_adc_channel: 13
dual_adc: true
# AM32 HARDWARE_GROUP_G4_D (Inc/targets.h): phase A on COMP2 (PA5/PA3),
# phases B and C on COMP1 (PA4/PA1 and PA0/PA1).
bemf_pins:
  phase_a: { comp: 2, inm: PA5, inp: PA3 }
  phase_b: { comp: 1, inm: PA4, inp: PA1 }
  phase_c: { comp: 1, inm: PA0, inp: PA1 }
